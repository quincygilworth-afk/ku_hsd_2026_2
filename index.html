<!DOCTYPE html>

<html lang="en"> 
<head>
    <meta charset="UTf-8">
<title> Gunter's Forge</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <h1> Welcome to Gunter's Forge</h1>
    <h2>Orders: <span id="OrderCount">0</span></h2>
    <div class="AllItems">
    <div class="SwordGroup">
    <img src="Sword.png"
    width="208">
    <button id="Sword_Purchase">Sword</button>
    </div>
    <div class="PlateArmorGroup">
    <img src="PlateArmor.png"
    width="208">
    <button id="PlateArmor_Purchase">Plate Armor</button>
    </div>
    <div class="ChainMailGroup">
    <img src="ChainMail.png"
    width="208">
    <button id="ChainMail_Purchase">Chain Mail</button>
    </div>
    <div class="CookingPotGroup">
    <img src="CookingPot.png"
    width="208">
    <button id="CookingPot_Purchase">Cooking Pot</button>
    </div>
</div>
<a href="To-Do.html">
<button id="ToDoList">Gunter's To-Do List</button>
</a>
</body>
<script>
    let orderCount = 0;

    function addOrder() {
        orderCount++;
        document.getElementById("OrderCount").textContent = orderCount;
    }

    document.getElementById("Sword_Purchase").addEventListener("click", addOrder);
    document.getElementById("PlateArmor_Purchase").addEventListener("click", addOrder);
    document.getElementById("ChainMail_Purchase").addEventListener("click", addOrder);
    document.getElementById("CookingPot_Purchase").addEventListener("click", addOrder);
</script>
</html>
