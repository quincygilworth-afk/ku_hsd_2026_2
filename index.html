<script>
    // keep track of total orders on Gunter's ToDo List
    let orderCount = 0;

    // Keep track of each item's orders
    let swordCount = 0;
    let plateArmorCount = 0;
    let chainMailCount = 0;
    let cookingPotCount = 0;

    function updateTotalOrders() {
        orderCount++;

        document.getElementById("OrderCount").textContent = orderCount; // gets the element order
        // count from html, the adds the text from
        // the omg youll gen never believe but it assigns the text to the variable ordercount

        // Show the coupon message when total orders reach 5
        if (orderCount === 5) {
            document.getElementById("CouponMessage").style.display = "block";

            alert(" Huzzah traveler! Ye hath earneth a coupon for thy investment in five total of my artisan goods!");
        }
    }

    document.getElementById("Sword_Purchase").addEventListener("click", function() {
        swordCount++; //*addEventListener tells the function to update the element each
        //time the sword button is clicked 
        document.getElementById("SwordCount").textContent = swordCount;
        updateTotalOrders();//updates total orders at the end 
    });
// the we rinse and repeat with all the other items up for code
    document.getElementById("PlateArmor_Purchase").addEventListener("click", function() {
        plateArmorCount++;
        document.getElementById("PlateArmorCount").textContent = plateArmorCount;
        updateTotalOrders();
    });

    document.getElementById("ChainMail_Purchase").addEventListener("click", function() {
        chainMailCount++;
        document.getElementById("ChainMailCount").textContent = chainMailCount;
        updateTotalOrders();
    });

    document.getElementById("CookingPot_Purchase").addEventListener("click", function() {
        cookingPotCount++;
        document.getElementById("CookingPotCount").textContent = cookingPotCount;
        updateTotalOrders();
    });
    

</script>
