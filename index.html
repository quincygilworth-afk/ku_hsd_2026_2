</head>
<body>
    
    <h1> Welcome to Gunter's Forge</h1>
    <h2>Gunter's To - Do List: <span id="OrderCount">0</span></h2>
    <div class="OrderCounts">
    <p>Swords ordered: <span id="SwordCount">0</span></p>
    <p>Plate Armor ordered: <span id="PlateArmorCount">0</span></p>
    <p>Chain Mail ordered: <span id="ChainMailCount">0</span></p>
    <p>Cooking Pots ordered: <span id="CookingPotCount">0</span></p>
</div>
    <div class="AllItems">
    <div class="SwordGroup">
    <img src="Sword.png"
    width="208">
    <button id="Sword_Purchase">Sword</button>
    </div>
    <div class="PlateArmorGroup">
    <img src="PlateArmor.png"
    width="208">
    <button id="PlateArmor_Purchase">Plate Armor</button>
    </div>
    <div class="ChainMailGroup">
    <img src="ChainMail.png"
    width="208">
    <button id="ChainMail_Purchase">Chain Mail</button>
    </div>
    <div class="CookingPotGroup">
    <img src="CookingPot.png"
    width="208">
    <button id="CookingPot_Purchase">Cooking Pot</button>
    </div>
</div>
<a href="To-Do.html">
<button id="ToDoList">Gunter's To-Do List</button>
</a>
</body>
<script>
    let orderCount = 0;

    // Keep track of each item's orders
    let swordCount = 0;
    let plateArmorCount = 0;
    let chainMailCount = 0;
    let cookingPotCount = 0;

    function updateGuntersToDoList() {
        orderCount++;
        document.getElementById("OrderCount").textContent = orderCount;
    }

    document.getElementById("Sword_Purchase").addEventListener("click", function() {
        swordCount++;
        document.getElementById("SwordCount").textContent = swordCount;
        updateTotalOrders();
    });

    document.getElementById("PlateArmor_Purchase").addEventListener("click", function() {
        plateArmorCount++;
        document.getElementById("PlateArmorCount").textContent = plateArmorCount;
        updateTotalOrders();
    });

    document.getElementById("ChainMail_Purchase").addEventListener("click", function() {
        chainMailCount++;
        document.getElementById("ChainMailCount").textContent = chainMailCount;
        updateTotalOrders();
    });

    document.getElementById("CookingPot_Purchase").addEventListener("click", function() {
        cookingPotCount++;
        document.getElementById("CookingPotCount").textContent = cookingPotCount;
        updateTotalOrders();
    });
    let orderCount = 0;

// Keep track of each item's orders
let swordCount = 0;
let plateArmorCount = 0;
let chainMailCount = 0;
let cookingPotCount = 0;

// Item prices
const prices = {
    sword: 100,
    plateArmor: 250,
    chainMail: 150,
    cookingPot: 50
};

// Discount system
let discountAvailable = false;
const discountRate = 0.10; // 10%

function updateTotalOrders() {
    orderCount++;
    document.getElementById("OrderCount").textContent = orderCount;
}

function purchaseItem(itemName, itemPrice, updateCount) {
    let finalPrice = itemPrice;

    // Apply discount if one is available
    if (discountAvailable) {
        finalPrice = itemPrice * (1 - discountRate);
        discountAvailable = false;

        document.getElementById("PurchaseMessage").textContent =
            `You used your 10% discount! Your ${itemName} costs ${finalPrice.toFixed(2)} gold.`;
    } else {
        document.getElementById("PurchaseMessage").textContent =
            `You bought ${itemName} for ${finalPrice.toFixed(2)} gold.`;
    }

    // Update the item's order count
    updateCount();

    // Update total orders
    updateTotalOrders();

    // Unlock a discount for the NEXT purchase
    discountAvailable = true;

    document.getElementById("DiscountMessage").textContent =
        "You have 10% off your next purchase!";
}

document.getElementById("Sword_Purchase").addEventListener("click", function() {
    purchaseItem("Sword", prices.sword, function() {
        swordCount++;
        document.getElementById("SwordCount").textContent = swordCount;
    });
});

document.getElementById("PlateArmor_Purchase").addEventListener("click", function() {
    purchaseItem("Plate Armor", prices.plateArmor, function() {
        plateArmorCount++;
        document.getElementById("PlateArmorCount").textContent = plateArmorCount;
    });
});

document.getElementById("ChainMail_Purchase").addEventListener("click", function() {
    purchaseItem("Chain Mail", prices.chainMail, function() {
        chainMailCount++;
        document.getElementById("ChainMailCount").textContent = chainMailCount;
    });
});

document.getElementById("CookingPot_Purchase").addEventListener("click", function() {
    purchaseItem("Cooking Pot", prices.cookingPot, function() {
        cookingPotCount++;
        document.getElementById("CookingPotCount").textContent = cookingPotCount;
    });
});

</script>

</html>
